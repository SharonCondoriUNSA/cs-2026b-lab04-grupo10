description: "Lab09 E4: evaluación de la iteración final v3 de docstrings"
prompts:
  - file://v3.txt
providers:
  - id: file://proveedor_grabado.py
    label: grabaciones-v3
    config:
      version: v3
tests: file://casos.yaml
defaultTest:
  assert:
    - type: is-json
      value: file://contrato.json
      metric: A1_contrato_json
    - type: javascript
      metric: A2_parametros_exactos_sin_self
      value: |
        let r; try { r = JSON.parse(output); } catch { return false; }
        const expected = (context.vars.parametros_esperados || '').split(',').filter(Boolean);
        if (!r || !Array.isArray(r.parametros) || typeof r.docstring !== 'string') return false;
        const actual = r.parametros.map(p => p?.nombre);
        if (actual.length !== expected.length || !expected.every((n, i) => actual[i] === n)) return false;
        const lines = r.docstring.split(/\r?\n/);
        const headers = lines.flatMap((line, i) => /^Args:[ \t]*$/.test(line) ? [i] : []);
        if (expected.length === 0) return headers.length === 0;
        if (headers.length !== 1) return false;
        const documented = [];
        let parameterIndent = null;
        let needsDescription = false;
        for (const line of lines.slice(headers[0] + 1)) {
          if (line.trim() === '') continue;
          if (/^\S/.test(line)) break;
          const parameter = /^([ \t]+)([A-Za-z_]\w*)(?:[ \t]*\([^)]*\))?:[ \t]*(.*)$/.exec(line);
          if (parameter) {
            if (parameterIndent === null) parameterIndent = parameter[1].length;
            if (parameter[1].length !== parameterIndent || needsDescription) return false;
            documented.push(parameter[2]);
            needsDescription = parameter[3].trim().length === 0;
          } else {
            const indentation = /^[ \t]*/.exec(line)[0].length;
            if (parameterIndent === null || indentation <= parameterIndent) return false;
            needsDescription = false;
          }
        }
        return !needsDescription && documented.length === expected.length &&
          expected.every((n, i) => documented[i] === n);
    - type: javascript
      metric: A3_descripciones_de_parametros
      value: |
        let r; try { r = JSON.parse(output); } catch { return false; }
        return (r.parametros || []).every(p => typeof p.descripcion === 'string' && p.descripcion.trim().length >= 5);
    - type: javascript
      metric: A4_docstring_sin_fences_y_con_resumen
      value: |
        let r; try { r = JSON.parse(output); } catch { return false; }
        return typeof r.docstring === 'string' && !r.docstring.includes('```') && r.docstring.includes(r.resumen);
    - type: javascript
      metric: A5_nombre_de_funcion_exact
      value: |
        let r; try { r = JSON.parse(output); } catch { return false; }
        return r.nombre === context.vars.nombre_esperado;
    - type: javascript
      metric: A6_consistencia_none
      value: |
        let r; try { r = JSON.parse(output); } catch { return false; }
        if (['D3','D4','D5','D6'].includes(context.vars.id)) return r.retorno === null && !/Returns:/i.test(r.docstring);
        return typeof r.retorno === 'string' && /Returns:/i.test(r.docstring);
